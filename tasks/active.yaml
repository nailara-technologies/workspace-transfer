---
# Usage Instructions
usage: |
  ## Adding a Task
  1. Choose priority level (high/medium/low)
  2. Copy quick_add_template
  3. Fill in details
  4. Assign unique ID (category_number)
  5. Commit changes

  ## Updating a Task
  1. Change status field
  2. Update progress percentage
  3. Add/remove blocker as needed
  4. Commit with message: "task: Update [id] status to [status]"

  ## Completing a Task
  1. Change status to "completed"
  2. Move entry to appropriate archive/[category]/
  3. Increment completed_summary.total
  4. Commit with message: "task: Complete [id] - [brief description]"

  ## Blocking a Task
  1. Change status to "blocked"
  2. Move to blocked section
  3. Set blocker field with clear description
  4. Set blocked_since date

