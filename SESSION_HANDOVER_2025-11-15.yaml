## CERTIFICATES FOR TESTING

To test HTTPS functionality, need to:

**Option A: Generate Self-Signed Certificate**
```bash
openssl req -x509 -newkey rsa:2048 -keyout /etc/protocol-7/certs/current.key \
  -out /etc/protocol-7/certs/current.pem -days 365 -nodes
```

**Option B: Use Let's Encrypt**
- letsencrypt zenka already configured
- Requires public domain and DNS setup
- Automatic renewal configured

