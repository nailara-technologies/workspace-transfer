  technical_insights: "TECHNICAL_INSIGHTS_2025-11-15.md (Sections 16-17: auth patterns)"
  session_handover: "SESSION_HANDOVER_2025-11-15_TEMPLATE_PROCESSING.md"
  onboarding: "START_HERE.md → bootstrap → status-check.pl"
