# Dependency Profiles
# Defines dependencies for different session types
# Format: profile -> package_manager -> packages

profiles:
  base:
    description: "Basic workspace dependencies"
    apt:
      - git
      - perl
      - curl
    cpan:
      - Time::Piece
      - File::Path
      - FindBin

  filesystem:
    description: "FUSE filesystem development"
    apt:
      - libfuse-dev
      - fuse
      - pkg-config
    cpan:
      - Fuse

  network:
    description: "Network distribution protocol"
    apt:
      - libssl-dev
      - libnet-ssleay-perl
    cpan:
      - IO::Socket::SSL
      - Net::SSLeay

  learning:
    description: "Learning system with SQLite"
    apt:
      - sqlite3
      - libsqlite3-dev
    cpan:
      - DBD::SQLite
      - DBI

  visualization:
    description: "Token visualization and graphing"
    apt:
      - gnuplot
      - imagemagick
      - libgd-dev
    cpan:
      - GD::Graph
      - GD::SVG
      - Chart::Gnuplot
    system:
      - gnuplot
      - convert  # ImageMagick

  archive:
    description: "Archive system with compression"
    apt:
      - xz-utils
      - tar
      - gzip

  protocol7_full:
    description: "Protocol-7 complete development environment"
    apt:
      - gcc
      - git
      - make
      - cpanminus
      - libc6-dev
      - libmce-perl
      - liburi-perl
      - libclone-perl
      - libevent-perl
      - libcryptx-perl
      - libio-stringy-perl
      - liblist-moreutils-perl
      - libio-aio-perl
      - libjson-xs-perl
      - libnet-dns-perl
      - libtimedate-perl
      - libhttp-date-perl
      - liburi-query-perl
      - libdigest-crc-perl
      - libdigest-elf-perl
      - libfile-which-perl
      - libfile-finder-perl
      - libperl-critic-perl
      - libsub-uplevel-perl
      - libbsd-resource-perl
      - libdigest-jhash-perl
      - libfile-extattr-perl
      - libfile-slurper-perl
      - libhash-flatten-perl
      - libhttp-message-perl
      - libyaml-libyaml-perl
      - libyaml-tiny-perl
      - libconfig-simple-perl
      - libio-socket-ssl-perl
      - libtest-requires-perl
      - libppix-utilities-perl
      - shared-mime-info
      - libtest-exception-perl
      - libtest-sharedfork-perl
      - libcurses-perl
      - libhash-merge-simple-perl
      - libproc-processtable-perl
      - libterm-readline-gnu-perl
      - libterm-readpassword-perl
      - libterm-readkey-perl
      - liblwp-protocol-https-perl
      - libclass-accessor-lite-perl
      - libio-socket-multicast-perl
      - libinline-c-perl
      - libconst-fast-perl
      - liblwpx-paranoidagent-perl
      - liblinux-inotify2-perl
      - libio-compress-perl
      - libcapture-tiny-perl
      - libfreezethaw-perl
      - libio-compress-lzma-perl
      - libgit-wrapper-perl
      - libcrypt-openssl-x509-perl
      - libcrypt-openssl-rsa-perl
      - libterm-size-perl
      - libunicode-string-perl
      - libunicode-maputf8-perl
    cpan:
      - Crypt::Ed25519
      - Digest::Skein
      - Digest::BMW
      - Net::IP::Lite
      - URI::QueryParam
      - File::MimeInfo::Magic
      - Sys::Statistics::Linux::CpuStats
      - SigAction::SetCallBack
      - Config::Hosts
      - Crypt::Curve25519
      - Poloniex::API

  development:
    description: "Full development environment (all profiles)"
    includes:
      - base
      - filesystem
      - network
      - learning
      - visualization
      - archive
      - protocol7_full
