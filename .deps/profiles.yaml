# Dependency Profiles
# Defines dependencies for different session types
# Format: profile -> package_manager -> packages

profiles:
  base:
    description: "Basic workspace dependencies"
    apt:
      - git
      - perl
      - curl
    cpan:
      - Time::Piece
      - File::Path
      - FindBin

  filesystem:
    description: "FUSE filesystem development"
    apt:
      - libfuse-dev
      - fuse
      - pkg-config
    cpan:
      - Fuse

  network:
    description: "Network distribution protocol"
    apt:
      - libssl-dev
      - libnet-ssleay-perl
    cpan:
      - IO::Socket::SSL
      - Net::SSLeay

  learning:
    description: "Learning system with SQLite"
    apt:
      - sqlite3
      - libsqlite3-dev
    cpan:
      - DBD::SQLite
      - DBI

  visualization:
    description: "Token visualization and graphing"
    apt:
      - gnuplot
      - imagemagick
      - libgd-dev
    cpan:
      - GD::Graph
      - GD::SVG
      - Chart::Gnuplot
    system:
      - gnuplot
      - convert  # ImageMagick

  archive:
    description: "Archive system with compression"
    apt:
      - xz-utils
      - tar
      - gzip

  protocol7_full:
    description: "Protocol-7 complete development environment"
    copy:
      - src: "data/lib-path/systemd/system/Protocol-7.service"
        dest: "/lib/systemd/system/Protocol-7.service"
        sudo: true
    symlinks:
      - target: "bin/Protocol-7"
        link: "/usr/local/bin/p7.v7"
        sudo: true
      - target: "bin/Protocol-7"
        link: "/usr/local/bin/p7.cube"
        sudo: true
      - target: "bin/Protocol-7"
        link: "/usr/local/bin/p7.keys"
        sudo: true
      - target: "bin/Protocol-7"
        link: "/usr/local/bin/p7.sourcecode"
        sudo: true
      - target: "bin/nshell"
        link: "/usr/local/bin/nshell"
        sudo: true
    paths:
      - "bin"
      - "bin/dev"
    exec:
      - cmd: "systemctl daemon-reload"
        sudo: true
    apt:
      - gcc
      - git
      - make
      - perl
      - cpanminus
      - libc6-dev
      # Core libraries and development tools
      - libmce-perl
      - liburi-perl
      - libclone-perl
      - libevent-perl
      - libcryptx-perl
      - libio-stringy-perl
      - liblist-moreutils-perl
      - libio-aio-perl
      - libjson-xs-perl
      - libnet-dns-perl
      - libtimedate-perl
      - libhttp-date-perl
      - liburi-query-perl
      - libdigest-crc-perl
      - libdigest-elf-perl
      - libdigest-perl
      - libfile-which-perl
      - libfile-finder-perl
      - libfile-mimeinfo-perl
      - libfile-rsync-perl
      - libfile-extattr-perl
      - libfile-slurper-perl
      - libperl-critic-perl
      - libsub-uplevel-perl
      - libbsd-resource-perl
      - libdigest-jhash-perl
      - libhash-flatten-perl
      - libhttp-message-perl
      - libhttp-Headers-perl
      - libhttp-Status-perl
      - libyaml-libyaml-perl
      - libyaml-tiny-perl
      - libconfig-simple-perl
      - libio-socket-ssl-perl
      - libtest-requires-perl
      - libppix-utilities-perl
      - libtest-exception-perl
      - libtest-sharedfork-perl
      - libcurses-perl
      - libhash-merge-simple-perl
      - libproc-processtable-perl
      - libterm-readline-gnu-perl
      - libterm-readpassword-perl
      - libterm-readkey-perl
      - libterm-clui-perl
      - libtext-unidecode-perl
      - libcompress-raw-lzma-perl
      - liblwp-protocol-https-perl
      - libclass-accessor-lite-perl
      - libio-socket-multicast-perl
      - libio-interface-perl
      - libinline-c-perl
      - libconst-fast-perl
      - liblwpx-paranoidagent-perl
      - liblwpx-paranoidzenka-perl
      - liblinux-inotify2-perl
      - libio-compress-perl
      - libio-compress-lzma-perl
      - libcapture-tiny-perl
      - libfreezethaw-perl
      - libgit-wrapper-perl
      - libcrypt-openssl-x509-perl
